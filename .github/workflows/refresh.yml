# Weekly rebuild and republish.
#
# WHY THIS RUNS IN THE CLOUD AND NOT ON A LAPTOP
# ----------------------------------------------
# The upstream Parquet lives on huggingface.co, which some corporate networks
# block outright (the author's does, under an "artificial-intelligence" filter
# category that serves a click-through interstitial no script can pass). GitHub's
# runners are on GitHub's network, so they reach both publishers normally. The
# refresh therefore stops depending on any one machine's network policy — and
# nothing on that machine is bypassed to achieve it.
#
# THE QUALITY GATE IS THE POINT
# -----------------------------
# An unattended job that publishes whatever it finds is a liability. This one
# rebuilds, runs the full verification suite, and republishes ONLY if that
# passes. On failure it opens an issue and the previously published site stays
# up, which is the right failure mode: stale but correct beats fresh but wrong.

name: Weekly data refresh

on:
  schedule:
    # 06:00 UTC every Friday. Cron on GitHub is UTC and has no timezone field.
    - cron: '0 6 * * 5'
  workflow_dispatch:        # manual trigger, for the first supervised run
  push:
    # New official files pushed by the relay on Max's laptop
    # (tools/relay_portal_snapshot.ps1) — rebuild now instead of waiting for
    # Friday. This cannot loop: pushes made by this workflow's own token never
    # trigger workflows.
    branches: [main]
    paths: ['data/portal_snapshot/**']

permissions:
  contents: write           # to commit rebuilt tiers
  issues: write             # to report a failed verification
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install duckdb pyarrow

      # petrodb comes from HuggingFace. Until 2026-11-13 the pipeline read it
      # remotely through DuckDB (hf_parquet driver) — hundreds of small Range
      # GETs per run — and HF started answering "429 Too Many Requests"
      # (runs of 12 + 13 Nov died in Enrich). Now: fetch each file whole,
      # with back-off, cache it, and run on the same local_parquet driver as
      # the laptop. petrodb is frozen (ends 2025-12), so the cache key is
      # static; bump the suffix if HF ever publishes new data.
      - name: Restore cached petrodb
        uses: actions/cache@v4
        with:
          path: data/raw/petrodb
          key: petrodb-hf-v1

      - name: Fetch petrodb from HuggingFace (only files not cached)
        run: python tools/fetch_petrodb_hf.py

      - name: Download official portal data
        run: python tools/00_download_portal.py

      - name: Verify
        id: verify
        run: python tools/02_verify.py

      - name: Enrich
        run: python tools/03_enrich.py

      - name: Rebuild web tiers
        run: python tools/04_build_web_data.py

      - name: Commit rebuilt tiers
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- config.toml
          # data/portal_snapshot only changes when the portal was reachable and
          # published something new; see tools/00_download_portal.py.
          git add site/data site/PROVENANCE.json docs/ data/portal_snapshot
          if git diff --staged --quiet; then
            echo "no change in the published data"
          else
            git commit -m "chore: weekly data refresh ($(date -u +%Y-%m-%d))"
            # The relay may have pushed a snapshot while this job ran. It only
            # touches data/portal_snapshot, so replaying our commit on top is
            # always clean.
            git pull --rebase --quiet
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4

      - name: Report a failed refresh
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly data refresh failed (${new Date().toISOString().slice(0,10)})`,
              body: [
                'The scheduled refresh did not complete, so **the previously',
                'published site is still live and unchanged** — which is the',
                'intended failure mode.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Most likely causes, in the order worth checking:',
                '1. An upstream schema change — `02_verify.py` fails loudly on',
                '   a renamed or retyped column rather than emptying a chart.',
                '2. A reconciliation drift against the official series.',
                '3. huggingface.co being unreachable. (datos.energia.gob.ar',
                '   being unreachable no longer fails the run — it falls back',
                '   to data/portal_snapshot/ with a warning.)',
              ].join('\n')
            })
